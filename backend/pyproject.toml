[project]
name = "jarvis-local-services"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1",
  "psycopg[binary,pool]>=3.2,<4", "langgraph>=1,<2",
  "langgraph-checkpoint-postgres>=3,<4", "langsmith>=0.4,<1",
  "google-auth>=2,<3", "google-auth-oauthlib>=1,<2",
  "python-dotenv>=1,<2", "pydantic-settings>=2,<3",
]
[dependency-groups]
dev = ["pytest>=8,<10"]
[tool.pytest.ini_options]
pythonpath = ["."]

