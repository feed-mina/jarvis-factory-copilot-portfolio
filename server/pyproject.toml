[project]
name = "jarvis-local-services"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1",
  "psycopg[binary,pool]>=3.2,<4", "langgraph>=1,<2",
  "langgraph-checkpoint-postgres>=3,<4", "langsmith>=0.4,<1",
  "google-auth>=2,<3", "google-auth-oauthlib>=1,<2",
  "python-dotenv>=1,<2", "pydantic-settings>=2,<3",
]
[dependency-groups]
dev = ["pytest>=8,<10"]
[tool.pytest.ini_options]
pythonpath = ["."]


[tool.ruff]
# 아래 파일은 버전 판정(release gate)이 "코드 글자 그대로"를 읽어 후보 버전을 만들고 지문을 뜬다.
# 줄 정리만 해도 판정 근거가 달라지므로 자동 정리 대상에서 뺀다.
extend-exclude = ["pipeline.py", "role_runner.py", "release_child.py", "release_gate.py", "release_runtime.py"]
