      "Trace": {
        "type": "object",
        "required": [
          "id",
          "taskId",
          "releaseId",
          "checkpointId",
          "events"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "taskId": {
            "type": "string"
          },
          "releaseId": {
            "type": "string"
          },
          "checkpointId": {
            "type": "string"
          },
          "events": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/TraceEvent"
            }
          }
        },
        "additionalProperties": false
      },
      "Draft": {
        "type": "object",
        "required": [
          "id",
          "revision",
          "sourceRevision",
          "sender",
          "recipient",
          "subject",
          "source",
          "body",
          "status",
          "classificationReason"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "revision": {
            "type": "integer"
          },
          "sourceRevision": {
            "type": "integer"
          },
          "sender": {
            "type": "string"
          },
          "recipient": {
            "type": "string"
          },
          "subject": {
            "type": "string"
          },
          "source": {
            "type": "string"
          },
          "body": {
            "type": "string"
          },
          "status": {
            "type": "string",
            "enum": [
              "pending",
