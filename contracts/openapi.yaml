    "/api/v1/tasks": {
      "get": {
        "operationId": "listTasks",
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/TaskSummary"
                  }
                }
              }
            }
          },
          "404": {
            "description": "Task not found"
          },
          "422": {
            "description": "Invalid event sequence"
          },
          "503": {
            "description": "Retry available"
          }
        }
      }
    },
    "/api/v1/tasks/{taskId}": {
      "get": {
        "operationId": "getTaskSnapshot",
        "parameters": [
          {
            "name": "taskId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "at",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 0
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TaskSnapshot"
                }
              }
            }
          },
          "404": {
            "description": "Task not found"
          },
          "422": {
            "description": "Invalid event sequence"
          },
          "503": {
            "description": "Retry available"
          }
        }
      }
    },
    "/api/v1/tasks/{taskId}/events": {
      "get": {
        "operationId": "streamTaskEvents",
        "description": "SSE snapshot (TaskSnapshot), replay_end, stream_error. id=event-N. Monotonic seq. Reconnect after last received sequence; production retention gaps require snapshot refresh.",
        "parameters": [
          {
            "name": "taskId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "after",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": -1
            }
          },
          {
            "name": "Last-Event-ID",
            "in": "header",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Server sent events",
            "content": {
              "text/event-stream": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "404": {
            "description": "Task missing"
          },
          "422": {
            "description": "Invalid resume cursor"
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "Release": {
        "type": "object",
        "required": [
          "id",
          "revision",
          "name",
          "health",
          "eligibility",
          "summary"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "revision": {
            "type": "integer"
          },
          "name": {
            "type": "string"
          },
          "health": {
            "enum": [
              "normal",
              "warning",
              "incident",
              "unknown"
            ],
            "type": "string"
          },
          "eligibility": {
            "enum": [
              "eligible",
              "blocked",
              "unknown"
            ],
            "type": "string"
          },
          "summary": {
            "type": "string"
          }
        },
        "additionalProperties": false
      },
      "Metric": {
        "type": "object",
        "required": [
          "id",
          "label",
          "baseline",
          "value",
          "unit",
          "criterion",
          "status",
          "samples"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "label": {
            "type": "string"
          },
          "baseline": {
            "type": [
              "number",
              "null"
            ]
          },
          "value": {
            "type": [
              "number",
              "null"
            ]
          },
          "unit": {
            "type": "string"
          },
          "criterion": {
            "type": "string"
          },
          "status": {
            "type": "string",
            "enum": [
              "pass",
              "fail",
              "unknown"
            ]
          },
          "samples": {
            "type": "integer"
          }
        },
        "additionalProperties": false
      },
      "Agent": {
        "type": "object",
        "required": [
          "id",
          "name",
          "parentId",
          "role",
          "status"
        ],
        "properties": {
