      "TraceEvent": {
        "type": "object",
        "required": [
          "id",
          "parentId",
          "name",
          "at",
          "durationMs",
          "status",
          "input",
          "output",
          "promptVersion",
          "model"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "parentId": {
            "type": [
              "string",
