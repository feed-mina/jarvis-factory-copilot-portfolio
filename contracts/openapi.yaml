            "properties": {
              "inputTokens": {
                "type": [
                  "number",
                  "null"
                ]
              },
              "outputTokens": {
                "type": [
                  "number",
                  "null"
                ]
              },
              "costUsd": {
                "type": [
                  "number",
                  "null"
                ]
              },
              "p95": {
                "type": [
                  "number",
                  "null"
                ]
              },
              "errorRate": {
                "type": [
                  "number",
                  "null"
                ]
              },
              "pendingEvents": {
                "type": "integer"
              },
              "completeness": {
                "type": [
                  "number",
                  "null"
                ]
              },
              "latency": {
                "type": "array",
                "items": {
                  "type": "object",
                  "required": [
                    "time",
                    "seconds"
                  ],
                  "properties": {
                    "time": {
                      "type": "string"
                    },
                    "seconds": {
                      "type": "number"
                    }
                  },
                  "additionalProperties": false
                }
              }
            },
            "additionalProperties": false
          },
          "approvals": {
            "type": "array",
            "items": {
              "type": "object",
              "required": [
                "id",
                "releaseId",
                "createdAt",
                "action"
              ],
              "properties": {
                "id": {
                  "type": "string"
                },
                "releaseId": {
                  "type": "string"
                },
                "createdAt": {
                  "type": "string"
                },
                "action": {
                  "type": "string"
                }
              },
              "additionalProperties": false
            }
          }
        },
        "additionalProperties": false
