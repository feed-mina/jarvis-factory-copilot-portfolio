            ]
          },
          "name": {
            "type": "string"
          },
          "at": {
            "type": "string"
          },
          "durationMs": {
            "type": "integer"
          },
          "status": {
            "type": "string"
          },
          "input": {
            "type": "string"
          },
          "output": {
            "type": "string"
          },
          "promptVersion": {
            "type": [
              "string",
