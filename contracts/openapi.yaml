          "id",
          "facts",
          "hypotheses",
          "actions",
          "traceIds"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "facts": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "hypotheses": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "actions": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "traceIds": {
            "type": "array",
            "items": {
              "type": "string"
            }
          }
        },
        "additionalProperties": false
      },
      "Report": {
        "type": "object",
        "required": [
          "release",
          "operatingRelease",
          "policyVersion",
          "observedAt",
          "metrics",
          "blockers",
          "diagnosis",
          "agents",
          "observation",
          "approvals"
        ],
        "properties": {
          "release": {
            "$ref": "#/components/schemas/Release"
          },
          "operatingRelease": {
            "type": "string"
          },
          "policyVersion": {
            "type": "string"
          },
          "observedAt": {
            "type": "string"
          },
          "metrics": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Metric"
            }
          },
          "blockers": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "diagnosis": {
            "$ref": "#/components/schemas/Diagnosis"
          },
          "agents": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Agent"
            }
          },
          "observation": {
            "type": "object",
            "required": [
              "inputTokens",
              "outputTokens",
              "costUsd",
              "p95",
              "errorRate",
              "pendingEvents",
              "completeness",
              "latency"
